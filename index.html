<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>MEHEDI TEMP MAIL</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">

<style>

*{
    font-family:'Space Grotesk',sans-serif;
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#f2f4f8;
    color:#1e293b;
    transition:.3s ease;
}

body.dark{
    background:#080b12;
    color:#e2e8f0;
}

/* ================= SPLASH ================= */

#splash{
    position:fixed;
    inset:0;
    z-index:99999;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:#f2f4f8;
    transition:.7s ease;
}

body.dark #splash{
    background:#080b12;
}

#splash.hide{
    opacity:0;
    transform:scale(1.05);
    pointer-events:none;
}

.splash-icon{
    font-size:76px;
    background:linear-gradient(135deg,#7c6aff,#4f8cff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:splashPulse 1.6s infinite;
}

.splash-logo{
    font-size:2.5rem;
    font-weight:800;
    margin-top:8px;
    background:linear-gradient(135deg,#7c6aff,#4f8cff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.splash-tag{
    margin-top:6px;
    color:#64748b;
    font-size:.9rem;
}

body.dark .splash-tag{
    color:#94a3b8;
}

.splash-loader{
    width:210px;
    height:5px;
    margin-top:30px;
    border-radius:99px;
    overflow:hidden;
    background:#dfe4ed;
}

body.dark .splash-loader{
    background:#202638;
}

.splash-loader-bar{
    width:0%;
    height:100%;
    border-radius:99px;
    background:linear-gradient(90deg,#7c6aff,#4f8cff);
    transition:.2s;
}

@keyframes splashPulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.08)}
}

/* ================= APP ================= */

#app{
    display:none;
    width:100%;
    height:100%;
    overflow:hidden;
    flex-direction:column;
    background:#f2f4f8;
}

body.dark #app{
    background:#080b12;
}

#app.active{
    display:flex;
}

/* ================= SCREEN ================= */

.screen{
    display:none;
    flex:1;
    height:100%;
    min-height:0;
    flex-direction:column;
    overflow:hidden;
}

.screen.active{
    display:flex;
}

/* ================= HEADER ================= */

.header{
    flex-shrink:0;
    height:62px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    background:rgba(255,255,255,.78);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border-bottom:1px solid rgba(0,0,0,.04);
    z-index:10;
}

body.dark .header{
    background:rgba(8,11,18,.82);
    border-color:rgba(255,255,255,.05);
}

.logo-title{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:800;
    font-size:18px;
}

.logo-title span{
    color:#7c6aff;
}

/* ================= CONTENT ================= */

.content{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:16px;
    padding-bottom:28px;
}

.no-scrollbar::-webkit-scrollbar{
    display:none;
}

.no-scrollbar{
    scrollbar-width:none;
}

/* ================= CARDS ================= */

.card{
    background:#fff;
    border:1px solid rgba(0,0,0,.035);
    border-radius:20px;
    box-shadow:0 7px 28px rgba(15,23,42,.055);
}

body.dark .card{
    background:#131824;
    border-color:rgba(255,255,255,.045);
    box-shadow:0 7px 28px rgba(0,0,0,.3);
}

/* ================= BUTTONS ================= */

.btn{
    border:none;
    outline:none;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    font-weight:700;
    border-radius:15px;
    min-height:46px;
    padding:10px 16px;
    transition:.15s ease;
}

.btn:active{
    transform:scale(.95);
}

.btn:disabled{
    opacity:.55;
    pointer-events:none;
}

.btn-primary{
    color:#fff;
    background:linear-gradient(135deg,#7c6aff,#4f8cff);
    box-shadow:0 5px 18px rgba(124,106,255,.25);
}

.btn-danger{
    color:#fff;
    background:linear-gradient(135deg,#ff6b6b,#ef4444);
    box-shadow:0 5px 18px rgba(239,68,68,.2);
}

.btn-secondary{
    color:#334155;
    background:#eef1f7;
}

body.dark .btn-secondary{
    color:#e2e8f0;
    background:#252c3d;
}

.btn-outline{
    color:#725ff3;
    background:transparent;
    border:1.5px solid #7967f5;
}

body.dark .btn-outline{
    color:#9b91ff;
    border-color:#8175ff;
}

.btn-icon{
    width:42px;
    height:42px;
    min-height:42px;
    padding:0;
    border:none;
    background:transparent;
    color:#64748b;
    border-radius:13px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.btn-icon:active{
    background:rgba(124,106,255,.1);
}

body.dark .btn-icon{
    color:#94a3b8;
}

/* ================= MAIL CARD ================= */

.mail-label{
    color:#94a3b8;
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:1px;
}

.mail-address{
    margin-top:9px;
    display:flex;
    align-items:center;
    gap:9px;
}

.mail-address-text{
    font-size:14px;
    font-weight:700;
    color:#334155;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

body.dark .mail-address-text{
    color:#e2e8f0;
}

/* ================= TIMER ================= */

.timer-box{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.timer-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.timer-icon{
    width:46px;
    height:46px;
    border-radius:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#7c6aff;
    background:rgba(124,106,255,.1);
}

.timer-title{
    color:#94a3b8;
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:1px;
}

.timer{
    font-size:25px;
    line-height:1.1;
    font-weight:800;
    margin-top:2px;
}

.timer-danger{
    color:#ef4444!important;
    animation:timerPulse 1s infinite;
}

@keyframes timerPulse{
    0%,100%{opacity:1}
    50%{opacity:.5}
}

/* ================= SECTION HEADER ================= */

.section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:3px 1px 8px;
}

.section-title{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:16px;
    font-weight:800;
}

.section-title .material-symbols-outlined{
    color:#7c6aff;
}

/* ================= BADGES ================= */

.count-badge{
    min-width:25px;
    height:22px;
    padding:0 7px;
    border-radius:99px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    background:rgba(124,106,255,.12);
    color:#705df2;
    font-size:11px;
    font-weight:800;
}

.otp-badge{
    display:inline-flex;
    align-items:center;
    gap:4px;
    padding:3px 8px;
    border-radius:99px;
    background:linear-gradient(135deg,#f59e0b,#f97316);
    color:white;
    font-size:9px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.6px;
    white-space:nowrap;
}

.security-badge{
    display:inline-flex;
    align-items:center;
    gap:4px;
    padding:4px 9px;
    border-radius:99px;
    background:rgba(239,68,68,.1);
    color:#dc2626;
    font-size:10px;
    font-weight:800;
}

body.dark .security-badge{
    background:rgba(248,113,113,.12);
    color:#f87171;
}

/* ================= EMAIL ITEM ================= */

.email-item{
    position:relative;
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:14px;
    margin-bottom:7px;
    border-radius:17px;
    background:rgba(255,255,255,.72);
    border:1px solid rgba(15,23,42,.035);
    cursor:pointer;
    transition:.15s ease;
}

body.dark .email-item{
    background:#131824;
    border-color:rgba(255,255,255,.045);
}

.email-item:active{
    transform:scale(.985);
}

.email-item.otp-item{
    background:linear-gradient(
        135deg,
        rgba(245,158,11,.11),
        rgba(249,115,22,.045)
    );
    border-color:rgba(245,158,11,.2);
}

body.dark .email-item.otp-item{
    background:linear-gradient(
        135deg,
        rgba(245,158,11,.13),
        rgba(249,115,22,.04)
    );
    border-color:rgba(245,158,11,.2);
}

.email-item.otp-item::before{
    content:"";
    position:absolute;
    left:0;
    top:10px;
    bottom:10px;
    width:4px;
    border-radius:0 5px 5px 0;
    background:linear-gradient(#f59e0b,#f97316);
}

.avatar{
    width:43px;
    height:43px;
    min-width:43px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-weight:800;
    font-size:14px;
    background:linear-gradient(135deg,#7c6aff,#4f8cff);
    box-shadow:0 4px 12px rgba(124,106,255,.2);
}

.avatar.otp-avatar{
    background:linear-gradient(135deg,#f59e0b,#f97316);
    box-shadow:0 4px 12px rgba(245,158,11,.2);
}

.email-main{
    flex:1;
    min-width:0;
}

.email-top{
    display:flex;
    align-items:center;
    gap:7px;
    min-width:0;
}

.email-subject{
    font-size:14px;
    font-weight:700;
    color:#1e293b;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

body.dark .email-subject{
    color:#f1f5f9;
}

.email-subject.otp-subject{
    color:#d97706;
    font-weight:800;
}

body.dark .email-subject.otp-subject{
    color:#fbbf24;
}

.email-from{
    margin-top:3px;
    color:#64748b;
    font-size:11px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

body.dark .email-from{
    color:#94a3b8;
}

.email-preview{
    margin-top:4px;
    color:#94a3b8;
    font-size:11px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.email-time{
    color:#94a3b8;
    font-size:10px;
    white-space:nowrap;
}

.unread-dot{
    width:7px;
    height:7px;
    min-width:7px;
    margin-top:5px;
    border-radius:50%;
    background:#7c6aff;
}

/* ================= EMPTY ================= */

.empty{
    text-align:center;
    padding:65px 20px;
}

.empty-icon{
    font-size:62px;
    color:#cbd5e1;
}

body.dark .empty-icon{
    color:#334155;
}

.empty-title{
    margin-top:12px;
    font-weight:800;
    color:#64748b;
}

body.dark .empty-title{
    color:#64748b;
}

.empty-sub{
    margin-top:4px;
    font-size:11px;
    color:#a8b1c0;
}

/* ================= DETAIL ================= */

.detail-content{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:16px;
    padding-bottom:30px;
}

.detail-header-info{
    display:flex;
    align-items:center;
    gap:12px;
}

.avatar-large{
    width:53px;
    height:53px;
    min-width:53px;
    border-radius:17px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:18px;
    font-weight:800;
    background:linear-gradient(135deg,#7c6aff,#4f8cff);
}

.avatar-large.otp-avatar{
    background:linear-gradient(135deg,#f59e0b,#f97316);
}

.detail-subject{
    font-size:17px;
    font-weight:800;
    color:#1e293b;
}

body.dark .detail-subject{
    color:#f1f5f9;
}

.detail-from{
    margin-top:3px;
    color:#64748b;
    font-size:12px;
    word-break:break-all;
}

body.dark .detail-from{
    color:#94a3b8;
}

.date-row{
    margin-top:15px;
    padding:10px 12px;
    border-radius:12px;
    background:#f6f7fa;
    color:#94a3b8;
    font-size:11px;
    display:flex;
    align-items:center;
    gap:6px;
}

body.dark .date-row{
    background:#0d111b;
}

/* ================= BODY ================= */

.detail-body{
    margin-top:16px;
    padding-top:16px;
    border-top:1px solid #edf0f4;
    line-height:1.8;
    font-size:14px;
    color:#334155;
    word-break:break-word;
    overflow-wrap:anywhere;
}

body.dark .detail-body{
    border-color:#252b38;
    color:#cbd5e1;
}

.detail-body img{
    max-width:100%;
    height:auto;
    border-radius:12px;
    margin:10px 0;
}

.detail-body a{
    color:#6d5af2;
    text-decoration:underline;
}

.detail-body p{
    margin-bottom:10px;
}

.detail-body blockquote{
    border-left:4px solid #7c6aff;
    padding-left:12px;
    margin:12px 0;
    color:#64748b;
}

/* ================= OTP CODE HIGHLIGHT ================= */

.otp-code-highlight{
    display:inline-flex!important;
    align-items:center;
    justify-content:center;
    min-width:75px;
    padding:5px 11px!important;
    margin:2px 3px;
    border-radius:10px;
    background:linear-gradient(135deg,#fff3c4,#ffe3a3)!important;
    color:#b45309!important;
    font-size:1.25em!important;
    font-weight:900!important;
    letter-spacing:2px;
    line-height:1.2!important;
    text-decoration:none!important;
    border:1px solid rgba(245,158,11,.35);
    box-shadow:0 3px 10px rgba(245,158,11,.14);
}

body.dark .otp-code-highlight{
    background:linear-gradient(135deg,#3a2c0d,#4b3510)!important;
    color:#fbbf24!important;
    border-color:rgba(251,191,36,.3);
}

/* larger standalone code */

.otp-code-box{
    margin:15px 0;
    padding:15px;
    border-radius:17px;
    text-align:center;
    background:linear-gradient(
        135deg,
        rgba(245,158,11,.12),
        rgba(249,115,22,.06)
    );
    border:1px solid rgba(245,158,11,.22);
}

.otp-code-label{
    font-size:10px;
    font-weight:800;
    color:#d97706;
    text-transform:uppercase;
    letter-spacing:1px;
}

body.dark .otp-code-label{
    color:#fbbf24;
}

.otp-code-value{
    margin-top:6px;
    font-size:29px;
    font-weight:900;
    letter-spacing:5px;
    color:#b45309;
}

body.dark .otp-code-value{
    color:#fbbf24;
}

.copy-code-btn{
    margin-top:9px;
    padding:7px 12px;
    border:0;
    border-radius:10px;
    background:rgba(245,158,11,.13);
    color:#b45309;
    font-size:11px;
    font-weight:800;
}

body.dark .copy-code-btn{
    color:#fbbf24;
}

/* ================= TOAST ================= */

#toast{
    position:fixed;
    left:50%;
    bottom:25px;
    z-index:999999;
    transform:translate(-50%,100px);
    opacity:0;
    pointer-events:none;
    min-width:180px;
    max-width:90%;
    padding:13px 19px;
    border-radius:15px;
    text-align:center;
    font-size:12px;
    font-weight:700;
    color:#fff;
    background:#1e293b;
    box-shadow:0 12px 40px rgba(0,0,0,.2);
    transition:.35s cubic-bezier(.34,1.56,.64,1);
}

#toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

#toast.success{
    background:linear-gradient(135deg,#059669,#10b981);
}

#toast.error{
    background:linear-gradient(135deg,#dc2626,#ef4444);
}

#toast.warning{
    background:linear-gradient(135deg,#d97706,#f59e0b);
}

/* ================= SPINNER ================= */

.spinner{
    width:20px;
    height:20px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.3);
    border-top-color:#fff;
    animation:spin .7s linear infinite;
}

.dark-spinner{
    border-color:rgba(124,106,255,.2);
    border-top-color:#7c6aff;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

/* ================= FADE ================= */

.fade{
    animation:fade .3s ease;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(8px);
    }
    to{
        opacity:1;
        transform:none;
    }
}

/* ================= MOBILE ================= */

@media(max-width:480px){

    .content,
    .detail-content{
        padding:13px;
        padding-bottom:25px;
    }

    .header{
        height:58px;
        padding:0 13px;
    }

    .btn{
        min-height:43px;
        padding:9px 13px;
        font-size:12px;
        border-radius:13px;
    }

    .card{
        border-radius:17px;
    }

    .email-item{
        padding:12px;
        border-radius:15px;
    }

    .email-subject{
        font-size:13px;
    }

    .splash-logo{
        font-size:2rem;
    }

    .splash-icon{
        font-size:60px;
    }

    .otp-code-value{
        font-size:26px;
    }
}

@media(min-width:768px){

    #app{
        width:440px;
        max-width:440px;
        margin:auto;
        border-left:1px solid rgba(0,0,0,.05);
        border-right:1px solid rgba(0,0,0,.05);
    }

    body.dark #app{
        border-color:rgba(255,255,255,.05);
    }
}

</style>
</head>

<body>

<!-- ================= SPLASH ================= -->

<div id="splash">

    <span class="material-symbols-outlined splash-icon">
        mark_email_unread
    </span>

    <div class="splash-logo">
        MEHEDI TEMP MAIL
    </div>

    <div class="splash-tag">
        No Login · No Signup · Just Privacy
    </div>

    <div class="splash-loader">
        <div id="splashBar" class="splash-loader-bar"></div>
    </div>

</div>

<!-- ================= TOAST ================= -->

<div id="toast"></div>

<!-- ================= APP ================= -->

<div id="app">

    <!-- ================= HOME ================= -->

    <div id="homeScreen" class="screen active">

        <header class="header">

            <div class="logo-title">
                <span class="material-symbols-outlined">mail</span>
                MEHEDI
            </div>

            <button id="themeToggle" class="btn-icon">
                <span id="themeIcon"
                      class="material-symbols-outlined">
                    light_mode
                </span>
            </button>

        </header>


        <main class="content no-scrollbar">

            <!-- ACTIONS -->

            <div class="flex gap-2 mb-4">

                <button id="changeMailBtn"
                        class="btn btn-primary flex-1">

                    <span class="material-symbols-outlined text-[19px]">
                        refresh
                    </span>

                    Change Mail

                </button>


                <button id="deleteMailBtn"
                        class="btn btn-danger flex-1">

                    <span class="material-symbols-outlined text-[19px]">
                        delete_forever
                    </span>

                    Delete

                </button>

            </div>


            <!-- EMAIL -->

            <div class="card p-4 mb-4">

                <div class="flex items-center justify-between">

                    <div class="mail-label">
                        Your Temporary Email
                    </div>

                    <button id="copyEmailBtn"
                            class="btn-icon">

                        <span class="material-symbols-outlined"
                              style="color:#7c6aff">
                            content_copy
                        </span>

                    </button>

                </div>


                <div class="mail-address">

                    <span class="material-symbols-outlined"
                          style="color:#7c6aff">
                        alternate_email
                    </span>

                    <span id="emailAddress"
                          class="mail-address-text">
                        Loading...
                    </span>

                </div>

            </div>


            <!-- TIMER -->

            <div class="card p-4 mb-5 timer-box">

                <div class="timer-left">

                    <div class="timer-icon">

                        <span class="material-symbols-outlined">
                            hourglass_top
                        </span>

                    </div>

                    <div>

                        <div class="timer-title">
                            Mail Lifetime
                        </div>

                        <div id="timerDisplay"
                             class="timer">
                            10:00
                        </div>

                    </div>

                </div>


                <button id="extendTimerBtn"
                        class="btn btn-outline">

                    <span class="material-symbols-outlined text-[18px]">
                        add
                    </span>

                    Extend

/* ================= HELPERS ================= */

function sleep(ms){
    return new Promise(resolve => setTimeout(resolve,ms));
}


function randomString(length=14){

    const chars =
        'abcdefghijklmnopqrstuvwxyz0123456789';

    let result='';

    for(let i=0;i<length;i++){

        result += chars[
            Math.floor(Math.random()*chars.length)
        ];

    }

    return result;
}


function escapeHTML(value){

    if(value === null || value === undefined){
        return '';
    }

    return String(value).replace(
        /[&<>"']/g,
        char => ({
            '&':'&amp;',
            '<':'&lt;',
            '>':'&gt;',
            '"':'&quot;',
            "'":'&#039;'
        }[char])
    );
}


function formatDate(date){

    if(!date){
        return '';
    }

    const d = new Date(date);

    if(isNaN(d.getTime())){
        return '';
    }

    const diff = Date.now() - d.getTime();

    if(diff < 60000){
        return 'Just now';
    }

    if(diff < 3600000){
        return Math.floor(diff/60000)+'m ago';
    }

    if(diff < 86400000){
        return Math.floor(diff/3600000)+'h ago';
    }

    if(diff < 172800000){
        return 'Yesterday';
    }

    return d.toLocaleDateString(
        'en-US',
        {
            month:'short',
            day:'numeric',
            hour:'2-digit',
            minute:'2-digit'
        }
    );
}


function getInitials(name){

    if(!name){
        return '?';
    }

    const clean = name.trim();

    if(!clean){
        return '?';
    }

    const parts = clean.split(/\s+/);

    if(parts.length === 1){
        return parts[0][0].toUpperCase();
    }

    return (
        parts[0][0] +
        parts[parts.length-1][0]
    ).toUpperCase();
}


/* ================= OTP DETECTION ================= */

function isOtp(text){

    if(!text){
        return false;
    }

    const value = String(text).toLowerCase();

    const keywords = [

        'otp',
        'one time password',
        'one-time password',

        'verification',
        'verification code',

        'verify code',
        'verify',

        'security code',
        'security pin',

        'login code',
        'login verification',

        'sign in code',
        'signin code',

        'authentication',
        'authenticate',

        'auth code',

        '2fa',
        'two factor',
        'two-factor',

        'mfa',

        'pin code',
        'passcode',

        'confirmation code',
        'confirm code'

    ];

    return keywords.some(
        keyword => value.includes(keyword)
    );
}


/* ================= CODE EXTRACTION ================= */

function extractCodes(text){

    if(!text){
        return [];
    }

    const clean = String(text);

    const found = [];

    /*
       Detect common verification codes:

       123456
       123 456
       123-456
       ABC123
       AB12CD
    */

    const patterns = [

        /\b\d{6}\b/g,

        /\b\d{4}\b/g,

        /\b\d{5}\b/g,

        /\b\d{3}[- ]\d{3}\b/g,

        /\b[A-Z0-9]{6,8}\b/gi

    ];

    patterns.forEach(pattern => {

        const matches = clean.match(pattern);

        if(matches){

            matches.forEach(code => {

                const normalized =
                    code.replace(/[\s-]/g,'');

                if(
                    normalized.length >= 4 &&
                    normalized.length <= 8 &&
                    !found.includes(normalized)
                ){

                    found.push(normalized);

                }

            });

        }

    });

    return found.slice(0,5);
}


/* ================= HIGHLIGHT CODES ================= */

function highlightVerificationCodes(html, plainText=''){

    if(!html){
        return '';
    }

    let result = html;

    /*
       Only modify visible text nodes approximately.
       Avoid touching HTML tags/attributes.
    */

    const codes = extractCodes(
        plainText || html.replace(/<[^>]*>/g,' ')
    );

    if(!codes.length){
        return result;
    }

    codes.forEach(code => {

        const escaped =
            code.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');

        const regex =
            new RegExp(
                '(?<![A-Za-z0-9])'+
                escaped+
                '(?![A-Za-z0-9])',
                'g'
            );

        result = result.replace(
            regex,
            `<strong class="otp-code-highlight">${code}</strong>`
        );

    });

    return result;
}


/* ================= TOAST ================= */

let toastTimer=null;

/* ================= API ================= */

async function fetchWithTimeout(
    url,
    options={},
    timeout=15000
){

    const controller =
        new AbortController();

    const timer =
        setTimeout(
            ()=>controller.abort(),
            timeout
        );

    try{

        const response =
            await fetch(
                url,
                {
                    ...options,
                    signal:controller.signal
                }
            );

        clearTimeout(timer);

        return response;

    }catch(error){

        clearTimeout(timer);

        throw error;

    }

}


async function apiCall(
    endpoint,
    options={}
){

    const url =
        'https://api.mail.tm'+endpoint;

    const headers={
        'Content-Type':'application/json',
        ...(options.headers || {})
    };

    if(state.token){

        headers.Authorization =
            'Bearer '+state.token;

    }

    const response =
        await fetchWithTimeout(
            url,
            {
                ...options,
                headers
            },
            15000
        );


    if(!response.ok){

        let message='';

        try{

            const data =
                await response.json();

            message =
                data['hydra:description'] ||
                data.message ||
                '';

        }catch{

            try{
                message=await response.text();
            }catch{}

        }

        throw new Error(
            message ||
            `API error ${response.status}`
        );

    }


    if(response.status===204){
        return null;
    }

    return response.json();

}


/* ================= CREATE EMAIL ================= */

async function createTempEmail(){

    try{

        const domains =
            await apiCall('/domains');

        if(
            !domains ||
            !domains['hydra:member'] ||
            !domains['hydra:member'].length
        ){

            throw new Error(
                'No email domain available'
            );

        }


        const domain =
            domains['hydra:member'][0].domain;


        const email =
            randomString(10)+'@'+domain;


        const password =
            randomString(18);


        const account =
            await apiCall(
                '/accounts',
                {
                    method:'POST',

                    body:JSON.stringify({
                        address:email,
                        password:password
                    })
                }
            );


        if(!account || !account.id){

            throw new Error(
                'Account creation failed'
            );

        }


        const tokenData =
            await apiCall(
                '/token',
                {
                    method:'POST',

                    body:JSON.stringify({
                        address:email,
                        password:password
                    })
                }
            );


        if(
            !tokenData ||
            !tokenData.token
        ){

            throw new Error(
                'Token retrieval failed'
            );

        }


        state.email=email;
        state.password=password;
        state.token=tokenData.token;
        state.accountId=account.id;

        state.messages=[];
        state.retryCount=0;

        emailAddressEl.textContent=email;

        showToast(
            '📬 New temporary email created!',

        );

    }catch(error){

        console.error(
            'createTempEmail:',
            error
        );

        if(state.retryCount < 2){

            state.retryCount++;

            showToast(
                'Retrying email creation...',
                'warning'
            );

            await sleep(1200);

            return createTempEmail();

        }

        showToast(
            'Failed to create email: '+error.message,
            'error'
        );

        return false;

    }

}

/* ================= OPEN EMAIL ================= */

async function openEmail(id){

    if(
        !state.token ||
        state.isLoading
    ){
        return;
    }

    state.isLoading=true;


    try{

        const message =
            await apiCall(
                '/messages/'+encodeURIComponent(id)
            );


        if(!message){
            throw new Error(
                'Message not found'
            );
        }


        state.currentMessageId=id;
        state.isDetailOpen=true;


        renderDetail(message);


        homeScreen.classList.remove('active');
        detailScreen.classList.add('active');

        detailContent.scrollTop=0;


        const index =
            state.messages.findIndex(
                m=>m.id===id
            );


        if(index>-1){

            state.messages[index].seen=true;

        }


        renderInbox(
            state.messages
        );


        history.pushState(
            {detail:true},
            ''
        );


    }catch(error){

        console.error(
            'openEmail:',
            error
        );


        showToast(
            'Failed to load message',
            'error'
        );


        detailContent.innerHTML=`

            <div class="card p-6 text-center">

    }finally{

        state.isLoading=false;

    }

/* ================= RENDER DETAIL ================= */

function renderDetail(message){

    const subject =
        escapeHTML(
            message.subject ||
            '(No subject)'
        );


    const from =
        escapeHTML(
            message.from &&
            message.from.address
            ? message.from.address
            : 'Unknown sender'
        );


    const time =
        message.createdAt
        ?
        new Date(
            message.createdAt
        ).toLocaleString(
            'en-US',
            {
                dateStyle:'medium',
                timeStyle:'short'
            }
        )
        :
        '';


    const initial =
        getInitials(
            message.from &&
            message.from.address
            ? message.from.address
            : 'U'
        );


    const combinedText =
        [
            message.subject || '',
            message.intro || '',
            message.text || '',
            message.html || ''
        ].join(' ');


    const otp =
        isOtp(combinedText);


    const plainText =
        message.text ||
        (message.html || '')
            .replace(/<[^>]*>/g,' ');


    const codes =
        extractCodes(
            plainText
        );


    let body='';


    if(
        message.html &&
        typeof message.html === 'string'
    ){

        body=message.html;


        /*
           Remove dangerous active elements.
        */

        body=body.replace(
            /<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi,
            ''
        );


        body=body.replace(
            /<iframe\b[^<]*(?:(?!<\/iframe>)<[^<]*)*<\/iframe>/gi,
            ''
        );


        body=body.replace(
            /<object\b[^<]*(?:(?!<\/object>)<[^<]*)*<\/object>/gi,
            ''
        );


        body=body.replace(
            /<embed\b[^>]*>/gi,
            ''
        );


        body=body.replace(
            /\son\w+\s*=\s*"[^"]*"/gi,
            ''
        );


        body=body.replace(
            /\son\w+\s*=\s*'[^']*'/gi,
            ''
        );


        body=highlightVerificationCodes(
            body,
            plainText
        );

    }

    else if(
        message.text &&
        typeof message.text === 'string'
    ){

        body =
            highlightVerificationCodes(
                escapeHTML(
                    message.text
                ).replace(/\n/g,'<br>'),
                message.text
            );

    }

    else{

        body=
            `<em class="text-slate-400">
                No message content
            </em>`;

    }


    let codeBox='';


    if(otp && codes.length){

        codeBox=`

            <div class="otp-code-box">

                <div class="otp-code-label">
                    🔐 Verification Code
                </div>

                <div class="otp-code-value">
                    ${escapeHTML(codes[0])}
                </div>

                <button
                    class="copy-code-btn"
                    id="copyOtpCodeBtn"
                    data-code="${escapeHTML(codes[0])}"
                >

                    <span class="material-symbols-outlined text-[15px] align-middle">
                        content_copy
                    </span>

                    Copy Code

                </button>

            </div>

        `;

    }


    detailBadge.style.display =
        otp ? 'inline-flex' : 'none';


    detailBadge.textContent =
        otp ? '🔐 OTP / CODE' : 'MESSAGE';


    detailContent.innerHTML=`

        <div class="card p-5 fade">

            <div class="detail-header-info">

                <div
                    class="avatar-large ${otp?'otp-avatar':''}"
                >
                    ${initial}
                </div>


                <div class="min-w-0 flex-1">

                    <div class="flex flex-wrap items-center gap-2">

                        <div class="detail-subject">
                            ${subject}
                        </div>

                        ${
                            otp
                            ?
                            `<span class="otp-badge">
                                🔐 OTP / VERIFICATION
                            </span>`
                            :
                            ''
                        }

                    </div>


                    <div class="detail-from">
                        ${from}
                    </div>

                </div>

            </div>


            <div class="date-row">

                <span class="material-symbols-outlined text-[16px]">
                    schedule
                </span>

                ${escapeHTML(time)}

            </div>


            ${codeBox}


            <div class="detail-body">

                ${body}

            </div>

        </div>


        <button
            id="deleteMsgBtn"
            class="btn btn-danger w-full mt-4"
        >

            <span class="material-symbols-outlined">
                delete
            </span>

            Delete Message

        </button>

    `;


    const deleteBtn =
        $('#deleteMsgBtn');


    if(deleteBtn){

        deleteBtn.onclick=()=>{

            const index =
                state.messages.findIndex(
                    m=>
                        m.id ===
                        state.currentMessageId
                );


            if(index>-1){

                state.messages.splice(
                    index,
                    1
                );

            }


            renderInbox(
                state.messages
            );


            showToast(
                '🗑️ Message removed',
                'success'
            );


            goBackToInbox();

        };

    }


    const copyCodeBtn =
        $('#copyOtpCodeBtn');


    if(copyCodeBtn){

        copyCodeBtn.onclick=()=>{

            const code =
                copyCodeBtn.dataset.code;


            copyText(
                code,
                '🔐 Verification code copied!'
            );

        };

    }

}


/* ================= COPY ================= */

async function copyText(
    text,
    successMessage='Copied!'
){

    if(!text){
        showToast(
            'Nothing to copy',
            'error'
        );
        return;
    }


    try{

        if(
            navigator.clipboard &&
            navigator.clipboard.writeText
        ){

            await navigator.clipboard.writeText(
                text
            );

        }else{

            fallbackCopy(text);

        }


        showToast(
            successMessage,
            'success'
        );


    }catch{

        fallbackCopy(text);

    }

}


function fallbackCopy(text){

    const textarea =
        document.createElement('textarea');

    textarea.value=text;

    textarea.style.position='fixed';
    textarea.style.opacity='0';

    document.body.appendChild(
        textarea
    );

    textarea.select();

    try{

        document.execCommand('copy');

    }catch{}

    textarea.remove();

}

async function getNewEmail(){

    stopTimer();
    stopInboxPolling();

    state.token='';
    state.messages=[];

    state.timerSeconds=600;

    timerDisplay.textContent='10:00';

    inboxList.innerHTML=`

        <div class="flex justify-center py-14">

            <span class="spinner dark-spinner"></span>

        </div>

    `;


    const success =
        await createTempEmail();


    if(success){

        startTimer();
        startInboxPolling();
        await checkInbox();

    }else{

        showToast(
            'Could not create new email',
            'error'
        );

    }

}


/* ================= DELETE MAIL ================= */

async function deleteMail(){

    if(
        !state.token ||
        !state.accountId
    ){

        showToast(
            'No active account',
            'warning'
        );

        return;

    }


    try{

        await apiCall(
            '/accounts/'+
            encodeURIComponent(
                state.accountId
            ),
            {
                method:'DELETE'
            }
        );

    }catch(error){

        console.warn(
            'Account delete:',
            error
        );

    }


    stopTimer();
    stopInboxPolling();

    state.token='';
    state.messages=[];

    state.timerSeconds=600;

    timerDisplay.textContent='10:00';


    inboxList.innerHTML=`

        <div class="flex justify-center py-14">

            <span class="spinner dark-spinner"></span>

        </div>

    `;


    showToast(
        '🗑️ Old mail deleted',
        'warning'
    );


    await sleep(500);


    const success =
        await createTempEmail();


    if(success){

        startTimer();
        startInboxPolling();
        await checkInbox();

    }

}


/* ================= TIMER ================= */

function startTimer(){

    stopTimer();


    state.timerInterval =
        setInterval(()=>{

            state.timerSeconds =
                Math.max(
                    0,
                    state.timerSeconds-1
                );


            updateTimer();


            if(
                state.timerSeconds===0
            ){

                stopTimer();

                showToast(
                    '⏰ Mail timer expired',
                    'warning'
                );

            }

        },1000);

}


function stopTimer(){

    if(state.timerInterval){

        clearInterval(
            state.timerInterval
        );

        state.timerInterval=null;

    }

}


function updateTimer(){

    const minutes =
        String(
            Math.floor(
                state.timerSeconds/60
            )
        ).padStart(2,'0');


    const seconds =
        String(
            state.timerSeconds%60
        ).padStart(2,'0');


    timerDisplay.textContent =
        minutes+':'+seconds;


    if(
        state.timerSeconds<60
    ){

        timerDisplay.classList.add(
            'timer-danger'
        );

    }else{

        timerDisplay.classList.remove(
            'timer-danger'
        );

    }

}


/* ================= EXTEND ================= */

function extendTimer(){

    if(state.isExtending){
        return;
    }


    state.isExtending=true;


    state.timerSeconds += 600;


    updateTimer();


    if(!state.timerInterval){
        startTimer();
    }


    showToast(
        '⏱️ Added 10 minutes!',
        'success'
    );


    setTimeout(()=>{
        state.isExtending=false;
    },400);

}


/* ================= POLLING ================= */

function startInboxPolling(){

    stopInboxPolling();

    checkInbox();


    state.inboxInterval =
        setInterval(()=>{

            if(
                !state.isDetailOpen &&
                state.token
            ){

                checkInbox();

            }

        },10000);

}


function stopInboxPolling(){

    if(state.inboxInterval){

        clearInterval(
            state.inboxInterval
        );

        state.inboxInterval=null;

    }

}


/* ================= SPINNER BUTTON ================= */

function buttonSpinner(button){

    const original =
        button.innerHTML;

    button.disabled=true;

    button.innerHTML=
        `<span class="spinner"></span>`;

    return ()=>{

        button.disabled=false;

        button.innerHTML=original;

    };

}


/* ================= SPLASH ================= */

function runSplash(){

    return new Promise(resolve=>{

        let progress=0;

        const interval =
            setInterval(()=>{

                progress += 4;

                if(progress>100){
                    progress=100;
                }


                splashBar.style.width =
                    progress+'%';


                if(progress>=100){

                    clearInterval(
                        interval
                    );

                    setTimeout(
                        resolve,
                        250
                    );

                }

            },25);

    });

}


/* ================= INIT ================= */

async function init(){

    /* Theme */

    setTheme(
        getTheme()
    );


    /* Splash */

    await runSplash();


    splash.classList.add(
        'hide'
    );


    app.classList.add(
        'active'
    );


    /* Create initial mail */

    const success =
        await createTempEmail();


    if(success){

        startTimer();
        startInboxPolling();

    }else{

        await sleep(1000);

        const retry =
            await createTempEmail();


        if(retry){

            startTimer();
            startInboxPolling();

        }

    }


    /* Events */


    themeToggle.onclick =
        toggleTheme;


    copyEmailBtn.onclick =
        copyEmail;


    changeMailBtn.onclick =
        async()=>{

            const restore =
                buttonSpinner(
                    changeMailBtn
                );

            try{

                await getNewEmail();

            }finally{

                restore();

            }

        };


    deleteMailBtn.onclick =
        async()=>{

            const restore =
                buttonSpinner(
                    deleteMailBtn
                );

            try{

                await deleteMail();

            }finally{

                restore();

            }

        };


    refreshInboxBtn.onclick =
        async()=>{

            const restore =
                buttonSpinner(
                    refreshInboxBtn
                );

            try{

                await checkInbox();

            }finally{

                restore();

            }

        };


    extendTimerBtn.onclick =
        extendTimer;


    backFromDetailBtn.onclick =
        goBackToInbox;


    window.addEventListener(
        'popstate',
        ()=>{

            if(state.isDetailOpen){

                goBackToInbox();

            }

        }
    );


    document.addEventListener(
        'visibilitychange',
        ()=>{

            if(
                !document.hidden &&
                state.token
            ){

                if(
                    !state.inboxInterval
                ){

                    startInboxPolling();

                }

                if(
                    !state.isDetailOpen
                ){

                    checkInbox();

                }

            }

        }
    );

}


/* ================= START ================= */

if(
    document.readyState ===
    'loading'
){

    document.addEventListener(
        'DOMContentLoaded',
        init
    );

}else{

    init();

}

})();

</script>
